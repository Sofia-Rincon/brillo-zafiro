<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brillo Zafiro - Joyería de Lujo</title>

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">

<body>

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="brand">
            BRILLO ZAFIRO
        </div>

        <nav class="nav">
            <a href="index.html">INICIO</a>
            <a href="categorias.html">CATEGORÍA</a>

    <main id="content">

        <!-- HERO -->
        <section
            class="hero"
            style="background-image: url('img/banner-ring.jpg');">

            <div class="hero-text">

                <h1 class="elegant-text">
                    Elegancia que realza<br>
                    tu belleza
                </h1>

                <a href="categorias.html" class="custom-btn banner-btn">
                    VER COLECCIONES
                </a>

            </div>

        </section>


        <!-- PRODUCTOS DESTACADOS -->
        <section class="featured-products">

            <h2>PRODUCTOS DESTACADOS:</h2>

            <div class="container">

                <div class="row justify-content-center g-4">

                    <div class="col-12 col-md-6 col-lg-4">

                        <div class="product-item">

                            <a href="aretes.html">

                                <img
                                    src="img/arete-destacado.jpg"
                                    alt="Aretes">

                                <p>ARETES</p>

                            </a>

                        </div>

                    </div>


                    <div class="col-12 col-md-6 col-lg-4">

                        <div class="product-item">

                            <a href="collares.html">

                                <img
                                    src="img/collar-destacado.jpg"
                                    alt="Collares">

                                <p>COLLARES</p>

                            </a>

                        </div>

                    </div>


                    <div class="col-12 col-md-6 col-lg-4">

                        <div class="product-item">

                            <a href="pulseras.html">

                                <img
                                    src="img/pulsera-destacado.jpg"
                                    alt="Pulseras">

                                <p>PULSERAS</p>

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- GALERÍA DE PRODUCTOS -->
        <section class="product-gallery">

            <h2>GALERÍA DE PRODUCTOS</h2>

            <div class="gallery-grid">


                <div class="gallery-item">

                    <img
                        src="img/galeria-item1.jpg"
                        alt="Artículo 1">

                    <a
                        href="anillos.html"
                        class="custom-btn gallery-btn">

                        Ver más

                    </a>

                </div>


                <div class="gallery-item">

                    <img
                        src="img/galeria-item2.jpg"
                        alt="Artículo 2">

                    <a
                        href="collares.html"
                        class="custom-btn gallery-btn">

                        Ver más

                    </a>

                </div>


                <div class="gallery-item">

                    <img
                        src="img/galeria-item3.jpg"
                        alt="Artículo 3">

                    <a
                        href="pulseras.html"
                        class="custom-btn gallery-btn">

                        Ver más

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="contact-info">

        <h3>INFORMACIÓN DE CONTACTO</h3>

        <p>📞 +57 315 202 2302</p>

        <p>📧 brillo.zafiro.joyerias@gmail.com</p>
